{% extends "base.html" %}
{% block content %}

<h2>Edit Customer</h2>

<form method="post" class="mt-3" style="max-width: 480px;">
    <div class="mb-3">
        <label class="form-label">First name</label>
        <input type="text" name="first_name" class="form-control"
               value="{{ customer[1] }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Last name</label>
        <input type="text" name="last_name" class="form-control"
               value="{{ customer[2] }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="text" name="phone" class="form-control"
               value="{{ customer[3] }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control"
               value="{{ customer[4] }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Address</label>
        <input type="text" name="address" class="form-control"
               value="{{ customer[5] }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Loyalty ID</label>
        <input type="text" name="loyalty" class="form-control"
               value="{{ customer[6] }}">
    </div>

    <button type="submit" class="btn btn-dark-yellow">Save changes</button>
    <a href="{{ url_for('customers') }}" class="btn btn-secondary btn-sm ms-2">Cancel</a>
</form>

{% endblock %}

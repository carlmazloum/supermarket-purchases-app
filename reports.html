{% extends "base.html" %}
{% block content %}

<h2>Delete Customer</h2>

<p class="text-muted">
  
</p>

<div class="card mt-3" style="max-width: 600px;">
    <div class="card-body">
        <h5 class="card-title">
            {{ customer[1] }} {{ customer[2] }}
        </h5>

        <p class="card-text mb-1"><strong>ID:</strong> {{ customer[0] }}</p>
        <p class="card-text mb-1"><strong>Phone:</strong> {{ customer[3] }}</p>
        <p class="card-text mb-1"><strong>Email:</strong> {{ customer[4] }}</p>
        <p class="card-text mb-1"><strong>Address:</strong> {{ customer[5] }}</p>
        <p class="card-text mb-1"><strong>Loyalty ID:</strong> {{ customer[6] }}</p>
    </div>
</div>

<form method="post" class="mt-3">
    <button type="submit" class="btn btn-danger">
        Yes, delete this customer
    </button>
    <a href="{{ url_for('customers') }}" class="btn btn-secondary ms-2">
        Cancel
    </a>
</form>

{% endblock %}

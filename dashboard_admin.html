{% extends "base.html" %}
{% block content %}

<h1>Edit Supplier</h1>
<p>Update the supplier information and save.</p>

<form method="post" class="mt-3">
    <div class="form-grid">
        <div class="form-field">
            <label>Name</label>
            <input type="text" name="name" value="{{ supplier[1] }}" required>
        </div>
        <div class="form-field">
            <label>Contact person</label>
            <input type="text" name="contact_person" value="{{ supplier[2] }}">
        </div>
        <div class="form-field">
            <label>Phone</label>
            <input type="text" name="phone" value="{{ supplier[3] }}">
        </div>
        <div class="form-field">
            <label>Email</label>
            <input type="email" name="email" value="{{ supplier[4] }}">
        </div>
        <div class="form-field">
            <label>Address</label>
            <input type="text" name="address" value="{{ supplier[5] }}">
        </div>
        <div class="form-field">
            <label>Lead time (days)</label>
            <input type="number" name="lead_time" value="{{ supplier[6] }}">
        </div>
        <div class="form-field">
            <label>Minimum order quantity</label>
            <input type="number" name="min_order" value="{{ supplier[7] }}">
        </div>
    </div>

    <div class="form-actions mt-3">
        <a href="{{ url_for('suppliers') }}" class="btn btn-outline">Cancel</a>
        <button type="submit" class="btn btn-primary">Save changes</button>
    </div>
</form>

{% endblock %}

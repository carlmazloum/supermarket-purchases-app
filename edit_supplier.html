{% extends "base.html" %}
{% block content %}

<h2>Employees</h2>
<p class="text-muted">Manage system users</p>

<a href="{{ url_for('add_employee') }}" class="btn btn-dark-yellow btn-sm">+ Add Employee</a>

<table class="table table-striped table-hover table-sm mt-3">
  <thead>
    <tr>
      <th>ID</th>
      <th>Username</th>
      <th>Full Name</th>
      <th>Role</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
  {% for e in employees %}
    <tr>
      <td>{{ e[0] }}</td>
      <td>{{ e[1] }}</td>
      <td>{{ e[2] }}</td>
      <td>{{ e[3] }}</td>
      <td>{{ e[4] }}</td>
      <td>
        <a href="{{ url_for('edit_employee', id=e[0]) }}" class="btn btn-warning btn-sm">Edit</a>
      <a href="/employees/delete/{{ e[0] }}">Delete</a>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>

{% endblock %}

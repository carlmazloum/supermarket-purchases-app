{% extends "base.html" %}
{% block content %}

<h2>Add Customer</h2>
<p class="text-muted">Fill in the customer information and save.</p>

<form method="post" class="mt-3">
    <div class="form-grid">
        <div class="form-field">
            <label>First name</label>
            <input type="text" name="first_name" required>
        </div>
        <div class="form-field">
            <label>Last name</label>
            <input type="text" name="last_name" required>
        </div>
        <div class="form-field">
            <label>Phone</label>
            <input type="text" name="phone">
        </div>
        <div class="form-field">
            <label>Email</label>
            <input type="email" name="email">
        </div>
        <div class="form-field">
            <label>Address</label>
            <input type="text" name="address">
        </div>
        <div class="form-field">
            <label>Loyalty ID</label>
            <input type="text" name="loyalty">
        </div>
    </div>

    <div class="mt-3 d-flex justify-content-end">
        <a href="{{ url_for('customers') }}" class="btn btn-outline me-2">Cancel</a>
        <button type="submit" class="btn btn-dark-yellow">Save customer</button>
    </div>
</form>

{% endblock %}

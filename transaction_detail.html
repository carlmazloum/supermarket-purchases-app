{% extends "base.html" %}
{% block content %}

<h2>Edit Product</h2>
<p class="text-muted">Update product details and stock quantity.</p>

<form method="POST">
  <div style="margin-bottom:12px;">
    <label>Product name</label>
    <input name="name" class="form-control" value="{{ product[1] }}" required>
  </div>

  <div style="margin-bottom:12px;">
    <label>Category</label>
    <input name="category" class="form-control" value="{{ product[2] }}" required>
  </div>

  <div style="margin-bottom:12px;">
    <label>Unit price</label>
    <input name="unit_price" type="number" step="0.01" class="form-control" value="{{ product[3] }}" required>
  </div>

  <div style="margin-bottom:12px;">
    <label>Stock quantity</label>
    <input name="stock_qty" type="number" class="form-control" value="{{ product[4] }}" required>
  </div>

  <div style="margin-bottom:12px;">
    <label>Status</label>
    <input name="status" class="form-control" value="{{ product[5] }}" required>
  </div>

  <button class="btn btn-dark-yellow btn-sm" type="submit">Save changes</button>
  <a class="btn btn-outline btn-sm" href="{{ url_for('products') }}">Cancel</a>
</form>

{% endblock %}

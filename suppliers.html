{% extends "base.html" %}
{% block content %}

<div class="card">
  <h2>Add Supplier Product</h2>

  <form method="POST">
    <label>Supplier</label>
    <select name="supplier_id" required>
      <option value="">-- Select supplier --</option>
      {% for s in suppliers %}
        <option value="{{ s.SupplierID }}">{{ s.Name }}</option>
      {% endfor %}
    </select>

    <label>Product</label>
    <select name="product_id" required>
      <option value="">-- Select product --</option>
      {% for p in products %}
        <option value="{{ p.ProductID }}">{{ p.Name }}</option>
      {% endfor %}
    </select>

    <label>Supplier Cost</label>
    <input type="number" name="supplier_cost" step="0.01" min="0" required>

    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-secondary" href="{{ url_for('supplier_products_list') }}">Cancel</a>
  </form>
</div>

{% endblock %}

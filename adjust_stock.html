{% extends "base.html" %}
{% block content %}

<h2>Edit Employee</h2>

<form method="POST">
  <label>Username</label>
  <input name="username" value="{{ emp[1] }}" class="form-control">

  <label class="mt-2">Full Name</label>
  <input name="fullname" value="{{ emp[3] }}" class="form-control">

  <label class="mt-2">Role</label>
  <input name="role" value="{{ emp[4] }}" class="form-control">

  <label class="mt-2">Status</label>
  <input name="status" value="{{ emp[5] }}" class="form-control">

  <button class="btn btn-dark-yellow mt-3">Save</button>
  <a href="{{ url_for('employees') }}" class="btn btn-secondary mt-3">Cancel</a>
</form>

{% endblock %}

{% extends "base.html" %}
{% block content %}

<div class="card">
  <h2>Add Employee</h2>

  {% if error %}
    <p style="color:#ff8080; font-weight:bold;">{{ error }}</p>
  {% endif %}

  <form method="POST">
    <label>Username</label><br>
    <input name="username" type="text" required><br><br>

    <label>Full Name</label><br>
    <input name="full_name" type="text" required><br><br>

    <label>Role</label><br>
    <input name="role" type="text" placeholder="Cashier / Admin / Manager" required><br><br>

    <label>Password</label><br>
    <input name="password" type="password" required><br><br>

    <label>Status</label><br>
    <select name="status">
      <option value="ACTIVE" selected>ACTIVE</option>
      <option value="INACTIVE">INACTIVE</option>
    </select>
    <br><br>

    <button type="submit">Add Employee</button>
    <a href="/employees" style="margin-left:10px;">Cancel</a>
  </form>
</div>

{% endblock %}

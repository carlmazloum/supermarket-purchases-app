{% extends "base.html" %}
{% block content %}

<h2>Add Product</h2>
<p class="text-muted">Enter product information.</p>

<form method="POST">

  <div style="margin-bottom:12px;">
    <label>Product name</label>
    <input name="name" class="form-control" required>
  </div>

  <div style="margin-bottom:12px;">
    <label>Description</label>
    <input name="description" class="form-control" placeholder="Optional">
  </div>

  <div style="margin-bottom:12px;">
    <label>Category</label>
    <input name="category" class="form-control" placeholder="e.g. Drinks, Dairy, Snacks" required>
  </div>

  <div style="margin-bottom:12px;">
    <label>Unit price</label>
    <input name="unit_price" type="number" step="0.01" min="0" class="form-control" required>
  </div>

  <div style="margin-bottom:12px;">
    <label>Unit cost</label>
    <input name="unit_cost" type="number" step="0.01" min="0" class="form-control" required>
  </div>

  <div style="margin-bottom:12px;">
    <label>Stock quantity</label>
    <input name="stock_qty" type="number" min="0" class="form-control" required>
  </div>

  <div style="margin-bottom:12px;">
    <label>Reorder level</label>
    <input name="reorder_level" type="number" min="0" class="form-control" value="0">
  </div>

  <div style="margin-bottom:12px;">
    <label>Status</label>
    <select name="status" class="form-control" required>
      <option value="ACTIVE" selected>ACTIVE</option>
      <option value="OK">OK</option>
      <option value="INACTIVE">INACTIVE</option>
    </select>
  </div>

  <button class="btn btn-dark-yellow btn-sm" type="submit">Save</button>
  <a class="btn btn-outline btn-sm" href="{{ url_for('products') }}">Cancel</a>

</form>

{% endblock %}
